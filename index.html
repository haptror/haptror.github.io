<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1e1e2e">
    <title>Shortcuts</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, sans-serif;
            --page-background: #eff1f5;
            --surface: #e6e9ef;
            --text: #4c4f69;
            --muted-text: #5c5f77;
            --border: #ccd0da;
            --input-border: #9ca0b0;
            --link: #8839ef;
            --link-hover: #ccd0da;
            --shadow: #4c4f6940;
            --backdrop: #4c4f6980;
            color: var(--text);
            background: var(--page-background);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --page-background: #1e1e2e;
            --surface: #181825;
            --text: #cdd6f4;
            --muted-text: #bac2de;
            --border: #313244;
            --input-border: #6c7086;
            --link: #cba6f7;
            --link-hover: #313244;
            --shadow: #11111b80;
            --backdrop: #11111bcc;
        }

        body {
            margin: 0;
        }

        main {
            width: min(100% - 2rem, 48rem);
            margin: 0 auto;
            padding: 2rem 0 3rem;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        h1 {
            margin-bottom: 0.5rem;
        }

        #theme-toggle {
            min-height: 2.75rem;
            padding: 0.6rem 0.85rem;
            border: 1px solid var(--input-border);
            border-radius: 0.75rem;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
        }

        .intro {
            margin-top: 0;
            color: var(--muted-text);
            line-height: 1.5;
        }

        #search {
            box-sizing: border-box;
            width: 100%;
            min-height: 3rem;
            margin: 1rem 0;
            padding: 0.75rem 1rem;
            border: 1px solid var(--input-border);
            border-radius: 0.75rem;
            background: var(--surface);
            color: var(--text);
            font: inherit;
        }

        section {
            margin-top: 1.5rem;
        }

        h2 {
            margin-bottom: 0.75rem;
            font-size: 1.2rem;
        }

        .shortcut-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr));
            gap: 0.65rem;
        }

        .shortcut-link {
            display: flex;
            align-items: center;
            min-height: 3rem;
            padding: 0.7rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            background: var(--surface);
            color: var(--link);
            font-weight: 600;
            text-decoration: none;
            touch-action: manipulation;
        }

        .shortcut-link:hover,
        .shortcut-link:focus-visible {
            border-color: var(--link);
            background: var(--link-hover);
        }

        #empty-state {
            color: var(--muted-text);
        }

        dialog {
            width: min(100% - 2rem, 24rem);
            padding: 1.25rem;
            border: 0;
            border-radius: 1rem;
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 1rem 3rem var(--shadow);
        }

        dialog::backdrop {
            background: var(--backdrop);
        }

        dialog form {
            display: grid;
            gap: 0.9rem;
        }

        dialog input,
        dialog button {
            box-sizing: border-box;
            min-height: 3rem;
            padding: 0.7rem 0.9rem;
            border: 1px solid var(--input-border);
            border-radius: 0.65rem;
            font: inherit;
        }

        dialog input,
        dialog button[type="button"] {
            background: var(--surface);
            color: var(--text);
        }

        dialog button[type="submit"] {
            border-color: var(--link);
            background: var(--link);
            color: var(--page-background);
            font-weight: 600;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>
    <main>
        <header class="page-header">
            <h1>Shortcuts</h1>
            <button id="theme-toggle" type="button" aria-pressed="true">Dark mode: On</button>
        </header>
        <p class="intro">Quick links for Android and Google apps. Available apps and behavior vary by phone, region, and installed apps.</p>
        <label for="search">Find a shortcut</label>
        <input id="search" type="search" placeholder="Search apps or actions" autocomplete="off">
        <div id="shortcut-list"></div>
        <p id="empty-state" hidden>No shortcuts match your search.</p>
        <dialog id="shortcut-dialog">
            <form id="shortcut-form">
                <label id="shortcut-dialog-label" for="shortcut-value"></label>
                <input id="shortcut-value" required autocomplete="off">
                <button type="submit">Open shortcut</button>
                <button id="cancel-shortcut" type="button">Cancel</button>
            </form>
        </dialog>
    </main>

    <script>
        const source = document.getElementById("shortcut-source").textContent;
        const shortcutList = document.getElementById("shortcut-list");
        const search = document.getElementById("search");
        const emptyState = document.getElementById("empty-state");
        const shortcutDialog = document.getElementById("shortcut-dialog");
        const shortcutForm = document.getElementById("shortcut-form");
        const shortcutValue = document.getElementById("shortcut-value");
        const shortcutDialogLabel = document.getElementById("shortcut-dialog-label");
        const themeToggle = document.getElementById("theme-toggle");
        const groups = new Map();
        let category = "";
        let label = "";
        let pendingTarget = "";
        let pendingPlaceholder = "";

        themeToggle.addEventListener("click", () => {
            const darkMode = document.documentElement.dataset.theme !== "dark";
            document.documentElement.dataset.theme = darkMode ? "dark" : "light";
            themeToggle.setAttribute("aria-pressed", String(darkMode));
            themeToggle.textContent = `Dark mode: ${darkMode ? "On" : "Off"}`;
            document.querySelector('meta[name="theme-color"]').content = darkMode ? "#1e1e2e" : "#eff1f5";
        });

        for (const line of source.split(/\r?\n/)) {
            if (line.startsWith("# ") && !line.startsWith("### ")) {
                category = line.slice(2).trim();
                continue;
            }

            if (line.startsWith("### ")) {
                label = line.slice(4).trim();
                continue;
            }

            if (!label || !line.trim()) {
                continue;
            }

            const target = line.trim().replaceAll("\\_", "_");
            if (!groups.has(category)) {
                const section = document.createElement("section");
                const heading = document.createElement("h2");
                const list = document.createElement("div");
                heading.textContent = category;
                list.className = "shortcut-list";
                section.append(heading, list);
                shortcutList.append(section);
                groups.set(category, { section, list });
            }

            const link = document.createElement("a");
            link.className = "shortcut-link";
            link.href = target;
            link.textContent = label;
            link.dataset.searchText = `${category} ${label}`.toLowerCase();

            const placeholders = [...target.matchAll(/\b(?:QUERY|VIDEO_ID|PHOTO_ID|PACKAGE_NAME|LOCATION|DESTINATION|TEXT|MEETING_CODE)\b|example\.com|recipient@example\.com/g)]
                .map((match) => match[0]);

            if (placeholders.length) {
                link.addEventListener("click", (event) => {
                    event.preventDefault();
                    pendingTarget = target;
                    pendingPlaceholder = placeholders[0];
                    shortcutDialogLabel.textContent = `Enter ${pendingPlaceholder.replaceAll("_", " ").toLowerCase()}:`;
                    shortcutValue.value = "";
                    shortcutDialog.showModal();
                    shortcutValue.focus();
                });
            }

            groups.get(category).list.append(link);
            label = "";
        }

        shortcutForm.addEventListener("submit", (event) => {
            event.preventDefault();
            if (!shortcutForm.reportValidity()) {
                return;
            }
            const destination = pendingTarget.replaceAll(pendingPlaceholder, encodeURIComponent(shortcutValue.value.trim()));
            shortcutDialog.close();
            window.location.href = destination;
        });

        document.getElementById("cancel-shortcut").addEventListener("click", () => {
            shortcutDialog.close();
        });

        search.addEventListener("input", () => {
            const query = search.value.trim().toLowerCase();
            let visibleCount = 0;
            for (const { section, list } of groups.values()) {
                let sectionCount = 0;
                for (const link of list.children) {
                    const visible = link.dataset.searchText.includes(query);
                    link.hidden = !visible;
                    sectionCount += Number(visible);
                }
                section.hidden = sectionCount === 0;
                visibleCount += sectionCount;
            }
            emptyState.hidden = visibleCount !== 0;
        });
    </script>
